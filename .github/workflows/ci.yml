name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Vet (Windows target, includes test files)
        run: |
          GOOS=windows CGO_ENABLED=0 go vet ./...

      - name: Unit tests
        run: |
          CGO_ENABLED=0 go test ./internal/... ./build/android/scripts/deps/...

  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install wails3 CLI (pinned to the version in go.mod)
        shell: bash
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          wails3 version

      - name: Generate Windows resource object (icon, manifest, version info)
        shell: bash
        working-directory: build
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          wails3 generate syso -arch amd64 -icon windows/icon.ico \
            -manifest windows/wails.exe.manifest \
            -info windows/info.json \
            -out ../wails_windows_amd64.syso

      - name: Build production exe
        shell: bash
        run: |
          go build -tags production -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui -X github.com/neurorift/neurorift/internal/nr.Version=dev-${GITHUB_SHA::7}" \
            -o build/bin/neurorift.exe .

      - name: Locate or install NSIS
        id: nsis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cands = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $exe = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $exe = $cmd.Source }
          }
          if (-not $exe) {
            Write-Host "NSIS not preinstalled - installing via Chocolatey"
            choco install nsis -y --no-progress --limit-output | Out-Null
            $exe = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "makensis unavailable" }
          "path=$exe" >> $env:GITHUB_OUTPUT
          Write-Host "makensis: $exe"

      - name: Compile-check NSIS installer script
        working-directory: build/windows/nsis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Dummy payloads: this validates the installer SCRIPT (every File
          # statement must resolve, all macros expand). The Release workflow
          # compiles the same script with the real artifacts.
          $d = "..\..\..\nsis-check"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content "$d\neurorift.exe" "ci dummy"
          Set-Content "$d\mihomo.exe" "ci dummy"
          Copy-Item "$d\mihomo.exe" "$d\MicrosoftEdgeWebview2Setup.exe"
          Copy-Item "$d\MicrosoftEdgeWebview2Setup.exe" .
          & "${{ steps.nsis.outputs.path }}" `
            "-DARG_WAILS_AMD64_BINARY=$d\neurorift.exe" `
            "-DNR_MIHOMO_BINARY=$d\mihomo.exe" `
            "-DINFO_PRODUCTVERSION=0.0.0" `
            "-DNR_OUTPUT=$d\NeuroRift-ci-check-setup.exe" `
            project.nsi
          if (-not (Test-Path "$d\NeuroRift-ci-check-setup.exe")) {
            throw "compile check produced no installer"
          }
          Write-Host "NSIS compile check OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: neurorift-windows-x64
          path: build/bin/neurorift.exe
          if-no-files-found: error
